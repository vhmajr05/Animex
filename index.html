<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09090B">
  <title>ANIMEX – Explorateur d'animés et de mangas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#09090B] text-zinc-100">

  <!-- En-tête : logo + navigation bureau -->
  <header class="sticky top-0 z-30 glass border-b border-white/5">
    <div class="max-w-7xl mx-auto px-4 h-14 flex items-center justify-between">
      <button data-nav="home" class="logo text-2xl font-extrabold tracking-[0.18em]">ANIMEX</button>
      <nav class="hidden md:flex gap-1">
        <button data-nav="home" class="nav-btn">Accueil</button>
        <button data-nav="explore" class="nav-btn">Explorer</button>
        <button data-nav="favs" class="nav-btn">Favoris <span id="favCount" class="ml-1 text-xs text-indigo-400"></span></button>
        <button data-nav="profile" class="nav-btn">Profil</button>
      </nav>
    </div>
  </header>

  <!-- Contenu de la page (rempli par app.js) -->
  <main id="view" class="max-w-7xl mx-auto px-4 pb-28 md:pb-12"></main>

  <!-- Barre de navigation mobile fixe -->
  <nav class="md:hidden fixed bottom-0 inset-x-0 z-30 glass border-t border-white/5 grid grid-cols-4 bottom-safe">
    <button data-nav="home" class="tab"><span>⌂</span>Accueil</button>
    <button data-nav="explore" class="tab"><span>⌕</span>Explorer</button>
    <button data-nav="favs" class="tab"><span>♥</span>Favoris</button>
    <button data-nav="profile" class="tab"><span>☺</span>Profil</button>
  </nav>

  <!-- Fenêtre de détails -->
  <div id="modal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm overflow-y-auto">
    <div id="modalBox" class="relative max-w-4xl mx-auto my-0 md:my-8 bg-[#141418] md:rounded-3xl min-h-full md:min-h-0 modal-in">
      <button id="modalClose" aria-label="Fermer" class="absolute top-3 right-3 z-10 w-10 h-10 rounded-full bg-black/60 hover:bg-indigo-600 transition">✕</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <div id="toast" class="fixed left-1/2 -translate-x-1/2 bottom-24 md:bottom-8 z-[60] px-4 py-2 rounded-full bg-indigo-600 text-sm opacity-0 pointer-events-none transition-opacity"></div>

  <script src="app.js"></script>
</body>
</html>
